name: Deploy to GitHub Pages

# Publishes the game to GitHub Pages on every push to the game branch.
# In the repo: Settings → Pages → Source → "GitHub Actions" (one-time).

on:
  push:
    branches:
      - claude/creature-breeding-game-luzdo0
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deploy; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Assemble only the static game files — leave out test/, README, .git, etc.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest _site/
          cp -r css js _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages via the API on first run so no manual toggle is needed.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
