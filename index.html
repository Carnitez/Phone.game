<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1429">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<title>Critter Ranch — Breed • Mutate • Sell</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥚</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="topbar">
  <div class="coins" id="coin-display">🪙 <span id="coin-amount">0</span></div>
  <div class="topbar-right">
    <button class="icon-btn" id="btn-help" title="How to play">❓</button>
    <button class="icon-btn" id="btn-settings" title="Settings">⚙️</button>
  </div>
</header>

<main id="view"></main>

<nav id="tabbar">
  <button class="tab active" data-tab="ranch"><span class="tab-ico">🏡</span><span class="tab-label">Ranch</span></button>
  <button class="tab" data-tab="wilds"><span class="tab-ico">🌿</span><span class="tab-label">Wilds</span></button>
  <button class="tab" data-tab="breeding"><span class="tab-ico">🥚</span><span class="tab-label">Breeding</span><span class="tab-badge" id="badge-breeding"></span></button>
  <button class="tab" data-tab="market"><span class="tab-ico">🛒</span><span class="tab-label">Market</span></button>
  <button class="tab" data-tab="guild"><span class="tab-ico">🏰</span><span class="tab-label">Guild</span><span class="tab-badge" id="badge-guild"></span></button>
</nav>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="js/data.js"></script>
<script src="js/genetics.js"></script>
<script src="js/game.js"></script>
<script src="js/fx.js"></script>
<script src="js/scene.js"></script>
<script src="js/guild.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
